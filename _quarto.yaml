format:
  html:
    default-image-extension: ""
    theme: cosmo
    toc: true
    toc-depth: 2
    number-sections: false
    fig-align: center
    lightbox: true
  pdf:
    pdf-engine: xelatex
    default-image-extension: ""
    documentclass: report
    toc: true
    number-sections: true
    colorlinks: true
    include-in-header:
      text: |
        \usepackage{array}
        \usepackage{longtable}
        \usepackage{booktabs}
        \renewcommand{\arraystretch}{1.2}
