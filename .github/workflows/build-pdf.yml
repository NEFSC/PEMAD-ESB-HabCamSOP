name: Build Master PDF (On Demand)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false

      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      # Converts HTML <table> blocks into Markdown pipe tables in < 1 second
      - name: Convert HTML Tables to Markdown Pipe Tables
        run: |
          python3 - << 'EOF'
          import os, re

          def convert_html_tables(text):
              def replace_table(match):
                  html_snippet = match.group(0)
                  rows = []
                  for tr in re.findall(r'<tr[^>]*>(.*?)</tr>', html_snippet, flags=re.DOTALL | re.IGNORECASE):
                      cells = []
                      for cell in re.findall(r'<(?:th|td)[^>]*>(.*?)</(?:th|td)>', tr, flags=re.DOTALL | re.IGNORECASE):
                          t = re.sub(r'<[^>]+>', ' ', cell)
                          t = ' '.join(t.split()).replace('|', '\\|')
                          cells.append(t)
                      if cells:
                          rows.append(cells)
                  if not rows:
                      return ''
                  max_cols = max(len(r) for r in rows)
                  for r in rows:
                      while len(r) < max_cols:
                          r.append('')
                  header = rows[0]
                  separator = ['---'] * max_cols
                  body = rows[1:]
                  lines = ['| ' + ' | '.join(header) + ' |', '| ' + ' | '.join(separator) + ' |']
                  for r in body:
                      lines.append('| ' + ' | '.join(r) + ' |')
                  return '\n\n' + '\n'.join(lines) + '\n\n'

              return re.sub(r'<table[^>]*>.*?</table>', replace_table, text, flags=re.DOTALL | re.IGNORECASE)

          count = 0
          for root, dirs, files in os.walk('.'):
              if any(skip in root for skip in ['_book', '_site', '.git']):
                  continue
              for f in files:
                  if f.endswith('.md') or f.endswith('.qmd'):
                      fpath = os.path.join(root, f)
                      with open(fpath, 'r', encoding='utf-8') as file:
                          content = file.read()
                      if '<table' in content.lower():
                          new_content = convert_html_tables(content)
                          with open(fpath, 'w', encoding='utf-8') as file:
                              file.write(new_content)
                          count += 1

          print(f"Finished table conversion. Converted tables across {count} chapters.")
          EOF

      - name: Render Master PDF
        run: quarto render --to pdf --verbose

      - name: Save PDF to Repository Root
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp _book/*.pdf ./HabCam_SOP.pdf
          git add HabCam_SOP.pdf
          git diff --staged --quiet || git commit -m "Update master HabCam_SOP.pdf with structured tables [skip ci]"
          git push

      - name: Render HTML and Prepare Site
        run: |
          # Discard table modifications before building HTML website
          git checkout -- .
          quarto render --to html
          cp HabCam_SOP.pdf _book/HabCam_SOP.pdf

      - name: Deploy to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
