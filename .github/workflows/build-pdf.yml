name: Build Master PDF (On Demand)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # Step 1: Quarto generates the LaTeX source files in ~25 seconds
      - name: Render Book to LaTeX Source
        run: quarto render --to latex --verbose

      # Step 2: Compile with raw XeLaTeX (streams every page live to your screen)
      - name: Compile PDF with XeLaTeX (Live Streaming)
        run: |
          TEX_FILE=$(find _book -name "*.tex" | head -n 1)
          if [ -z "$TEX_FILE" ]; then
            echo "ERROR: No .tex file found in _book!"
            find . -name "*.tex"
            exit 1
          fi

          TEX_DIR=$(dirname "$TEX_FILE")
          TEX_BASE=$(basename "$TEX_FILE")
          echo "Found LaTeX source: $TEX_BASE in $TEX_DIR"

          cd "$TEX_DIR"

          echo "=== PASS 1: Layout and Graphic Placement ==="
          xelatex -interaction=nonstopmode -halt-on-error "$TEX_BASE"

          echo "=== PASS 2: Table of Contents & Cross-References ==="
          xelatex -interaction=nonstopmode -halt-on-error "$TEX_BASE"

          COMPILED_PDF=$(ls *.pdf | head -n 1)
          echo "Successfully compiled: $COMPILED_PDF"
          cp "$COMPILED_PDF" "$GITHUB_WORKSPACE/HabCam_SOP.pdf"

      # Step 3: Commit master PDF to repository root
      - name: Save PDF to Repository Root
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add HabCam_SOP.pdf
          git diff --staged --quiet || git commit -m "Update master HabCam_SOP.pdf [skip ci]"
          git push

      # Step 4: Render HTML and deploy to GitHub Pages
      - name: Render HTML and Publish
        run: |
          quarto render --to html
          cp HabCam_SOP.pdf _book/HabCam_SOP.pdf

      - name: Deploy to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
