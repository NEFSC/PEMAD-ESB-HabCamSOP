name: Build Master PDF (On Demand)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false

      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install Python Parser
        run: pip install beautifulsoup4

      # Parses and converts all HTML tables to Markdown pipe tables via BeautifulSoup
      - name: Convert HTML Tables to Markdown Pipe Tables
        run: |
          python3 - << 'EOF'
          import os, re
          from bs4 import BeautifulSoup

          def html_table_to_markdown(table_soup):
              rows = []
              tr_elements = table_soup.find_all('tr')
              
              for tr in tr_elements:
                  cells = []
                  for cell in tr.find_all(['th', 'td']):
                      # Replace <br> tags with spaces before extracting text
                      for br in cell.find_all('br'):
                          br.replace_with(' ')
                      txt = cell.get_text(separator=' ', strip=True)
                      txt = re.sub(r'\s+', ' ', txt).strip().replace('|', '\\|')
                      cells.append(txt)
                  if cells and any(c for c in cells):
                      rows.append(cells)

              if not rows:
                  return ''

              max_cols = max(len(r) for r in rows)
              if max_cols == 0:
                  return ''

              for r in rows:
                  while len(r) < max_cols:
                      r.append('')

              header = [c if c else f'Col {i+1}' for i, c in enumerate(rows[0])]
              separator = ['---'] * max_cols
              body = rows[1:]
              if not body:
                  body = [[''] * max_cols]

              lines = ['| ' + ' | '.join(header) + ' |', '| ' + ' | '.join(separator) + ' |']
              for r in body:
                  lines.append('| ' + ' | '.join(r) + ' |')

              return '\n\n' + '\n'.join(lines) + '\n\n'

          total_tables = 0
          for root, dirs, files in os.walk('.'):
              if any(skip in root for skip in ['_book', '_site', '.git']):
                  continue
              for f in files:
                  if f.endswith('.md') or f.endswith('.qmd'):
                      fpath = os.path.join(root, f)
                      with open(fpath, 'r', encoding='utf-8') as file:
                          content = file.read()

                      if '<table' in content.lower():
                          soup = BeautifulSoup(content, 'html.parser')
                          tables = soup.find_all('table')
                          if tables:
                              for table in tables:
                                  md_tbl = html_table_to_markdown(table)
                                  if md_tbl:
                                      content = content.replace(str(table), md_tbl)
                                      total_tables += 1
                              with open(fpath, 'w', encoding='utf-8') as file:
                                  file.write(content)
                              print(f"[OK] Converted {len(tables)} table(s) in {fpath}")

          print(f"Total HTML tables converted: {total_tables}")
          EOF

      # Render PDF with non-interactive flags and closed stdin
      - name: Render Master PDF
        id: render_pdf
        timeout-minutes: 15
        run: |
          quarto render --to pdf --verbose --pdf-engine-opt="-interaction=nonstopmode" --pdf-engine-opt="-halt-on-error" < /dev/null

      - name: Show LaTeX Log on Error
        if: always() && steps.render_pdf.outcome == 'failure'
        run: |
          echo "=== SEARCHING COMPILER LOG FOR ERROR LINES ==="
          find . -name "*.log" -exec grep -n -C 5 "^!" {} + || true
          echo "=== TAIL OF COMPILER LOG ==="
          find . -name "*.log" -exec tail -n 80 {} + || true

      - name: Save PDF to Repository Root
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp _book/*.pdf ./HabCam_SOP.pdf
          git add HabCam_SOP.pdf
          git diff --staged --quiet || git commit -m "Update master HabCam_SOP.pdf with structured tables [skip ci]"
          git push

      - name: Render HTML and Prepare Site
        run: |
          git checkout -- .
          quarto render --to html
          cp HabCam_SOP.pdf _book/HabCam_SOP.pdf

      - name: Deploy to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
