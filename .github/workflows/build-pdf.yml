name: Build Master PDF (On Demand)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # Generates the complete 35-chapter PDF via XeLaTeX
      - name: Render Master PDF
        timeout-minutes: 20
        run: quarto render --to pdf --verbose

      # Copies the generated PDF to root and commits it
      - name: Save PDF to Repository Root
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp _book/*.pdf ./HabCam_SOP.pdf
          git add HabCam_SOP.pdf
          git diff --staged --quiet || git commit -m "Update master HabCam_SOP.pdf [skip ci]"
          git push

      # Builds the HTML website and copies HabCam_SOP.pdf into the distribution bundle
      - name: Render HTML and Prepare Site
        run: |
          quarto render --to html
          cp HabCam_SOP.pdf _book/HabCam_SOP.pdf

      # Publishes both the HTML site and the downloadable PDF live to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
