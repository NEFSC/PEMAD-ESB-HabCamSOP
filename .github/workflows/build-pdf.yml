name: Build Master PDF (On Demand)
name: Build Master PDF (On Demand)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render Master PDF (Live Streamed)
        timeout-minutes: 10
        run: |
          # Kill background watcher automatically when the step finishes
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT

          # Stream the compiler log live to the console in real time
          python3 - << 'EOF' &
          import time, glob, sys
          print(">> Waiting for XeLaTeX compiler log to open...", flush=True)
          for _ in range(180):
              logs = [f for f in glob.glob("**/*.log", recursive=True) if not f.startswith(".git")]
              if logs:
                  log_file = logs[0]
                  print(f"\n=== LIVE COMPILER STREAM STARTED ({log_file}) ===\n", flush=True)
                  with open(log_file, "r", errors="replace") as f:
                      while True:
                          line = f.readline()
                          if line:
                              sys.stdout.write(line)
                              sys.stdout.flush()
                          else:
                              time.sleep(0.3)
              time.sleep(1)
          EOF

          quarto render --to pdf --verbose

      - name: Save PDF to Repository Root
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp _book/*.pdf ./HabCam_SOP.pdf
          git add HabCam_SOP.pdf
          git diff --staged --quiet || git commit -m "Update master HabCam_SOP.pdf [skip ci]"
          git push

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
